name: Bug report
description: Report a reproducible problem in the gallery or a playable game.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Game gallery
        - Published game
        - Artifact proxy
        - Contribution tooling
        - Deployment
        - Other
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or route
      placeholder: https://mirageml.com/play/...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the shortest sequence that reliably reproduces the problem.
      placeholder: |
        1. Open …
        2. Press …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, input device, viewport, and commit or game ID.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, recordings, console output, or links without secrets or private data.
