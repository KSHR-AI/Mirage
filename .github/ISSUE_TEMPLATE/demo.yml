name: Model-built game proposal
description: Prepare a deployed coding-model run for MirageML Bench.
title: "[Game]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        First create a brand-new public repository and give your coding agent the [Mirage game-agent prompt](https://github.com/KSHR-AI/Mirage/blob/main/submissions/AGENT_PROMPT.md). Return here only after the game is finished, committed, pushed, and publicly deployed.
  - type: input
    id: source_repository
    attributes:
      label: Public source repository
      description: The standalone repository containing this frozen game attempt.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: Source commit
      description: The exact frozen revision; branches and tags are not accepted.
      placeholder: 40-character lowercase Git commit
    validations:
      required: true
  - type: input
    id: play_url
    attributes:
      label: Public play URL
      description: A stable HTTPS URL that returns the deployed game directly without login or redirects.
      placeholder: https://owner.github.io/repository/
    validations:
      required: true
  - type: input
    id: hosting_provider
    attributes:
      label: Hosting provider
      placeholder: GitHub Pages, Cloudflare Pages, Vercel, Netlify, or other
    validations:
      required: true
  - type: dropdown
    id: lineage
    attributes:
      label: Lineage
      description: Independent means the agent could not access Mirage or previous runs before the game was frozen.
      options:
        - Independent
        - Derived
        - Unverified
    validations:
      required: true
  - type: input
    id: lineage_reference
    attributes:
      label: Seed digest, parent game, or uncertainty
      description: Supply the seed digest, accepted parent ID and source revision, or a precise uncertainty note.
      placeholder: sha256:... or earlier-game-001 or isolation record missing
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: Provider and exact model identifier when available
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Agent and setup
      description: Include model snapshot, harness, reasoning level, tools, agent counts, and human interventions.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Exact prompt
      description: Paste the complete prompt or explain precisely why it is partial or unavailable.
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: Game, controls, cover, and limitations
      description: Describe observable features, real controls, relative cover path, play checks, and known failures.
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: Code and asset licensing
      description: Inventory every third-party asset and license, or state that the game uses only original code and procedural assets.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checks
      options:
        - label: The repository and exact commit are public and contain no credentials or private data.
          required: true
        - label: The game was completed and frozen before the coding agent inspected Mirage or previous benchmark runs.
          required: true
        - label: The public deployment and cover return directly without authentication or redirects and permit mirageml.com framing.
          required: true
        - label: I will keep the accepted deployment online and unchanged, or submit a deployment-only relocation.
          required: true
        - label: The game uses original or properly licensed code and assets and does not reproduce protected Rockstar or Take-Two material.
          required: true
