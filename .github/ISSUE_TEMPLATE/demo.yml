name: Model-built demo proposal
description: Propose a new playable model-built game before opening its pull request.
title: "[Demo]: "
labels:
  - enhancement
body:
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: Provider and exact model identifier when available
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: Starting commit
      placeholder: 40-character Git commit
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Agent and setup
      description: Include the agent, reasoning level, tools, agent count, and known human interventions.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Exact prompt
      description: Paste or link the complete prompt without credentials or private data.
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Artifact and license plan
      description: Describe the playable route or immutable artifact and the licenses for code and assets.
    validations:
      required: true
