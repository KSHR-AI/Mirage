name: Benchmark or product proposal
description: Propose a scoped improvement to the benchmark, evaluator, site, or gameplay.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, missing, misleading, or not reproducible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful intervention.
    validations:
      required: true
  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark integrity
      description: Explain effects on comparability, provenance, frozen tasks, budgets, or evaluator behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What observable behavior or test would prove the change works?
    validations:
      required: true
