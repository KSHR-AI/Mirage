name: Product or gameplay proposal
description: Propose a scoped improvement to the gallery, a published game, or the project.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, missing, misleading, or not reproducible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful intervention.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Game provenance
      description: Explain effects on the recorded model, source, prompt, setup, or asset licenses.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What observable behavior or test would prove the change works?
    validations:
      required: true
