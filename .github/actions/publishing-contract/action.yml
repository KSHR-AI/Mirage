name: Check publishing control-plane contract
description: Reject publishing workflow changes that collapse Mirage trust boundaries.

inputs:
  workflow:
    description: Repository-relative path to the publishing workflow.
    required: false
    default: .github/workflows/publish-submissions.yml

runs:
  using: composite
  steps:
    - name: Check workflow security invariants
      shell: bash
      env:
        CONTRACT_WORKFLOW: ${{ inputs.workflow }}
      run: node "$GITHUB_ACTION_PATH/check.mjs" "$CONTRACT_WORKFLOW"
