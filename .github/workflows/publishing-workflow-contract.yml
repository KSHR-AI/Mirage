name: Publishing workflow contract

on:
  # This job is a protected-branch requirement, so it must report on every PR.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/actions/publishing-contract/**"
      - ".github/workflows/publish-submissions.yml"
      - ".github/workflows/publishing-workflow-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: publishing-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Enforce publishing trust boundaries
        uses: ./.github/actions/publishing-contract
