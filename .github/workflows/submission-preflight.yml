name: Submission preflight

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: >-
    mirage-submission-preflight-${{
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.event_name
    }}
  cancel-in-progress: true

jobs:
  verify:
    name: submission-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - name: Validate changed submission records
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_PATH: ${{ runner.temp }}/mirage-submission-plan.json
        run: >-
          node scripts/submissions/validate-submissions.mjs
          --mode changed
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --output "$PLAN_PATH"

      - name: Validate every accepted record
        if: github.event_name != 'pull_request'
        env:
          PLAN_PATH: ${{ runner.temp }}/mirage-submission-plan.json
        run: >-
          node scripts/submissions/validate-submissions.mjs
          --mode all
          --output "$PLAN_PATH"

      - name: Verify source commits and external deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_PATH: ${{ runner.temp }}/mirage-submission-plan.json
        run: >-
          node scripts/submissions/verify-deployments.mjs
          --plan "$PLAN_PATH"
